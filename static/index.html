<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM พงษ์สกุล ฮาร์ดแวร์</title>
<style>
/* ทิศทาง: แดง-ขาว สะอาด ตัวอักษรเข้มคมชัด การ์ดขาวขอบมนบนพื้นเทาอ่อน เงานุ่ม
   เลย์เอาต์: แถบเมนูแดงด้านบน / ไซด์บาร์ป้ายกำกับด้านซ้าย / รายการหลักพร้อมแท็บสถานะ */
:root {
  --bg: #f4f4f6; --surface: #ffffff; --ink: #1d1b1f; --muted: #5e5e66; --line: #e6e6ea; --line-strong: #cfcfd6;
  --red: #d6232a; --red-deep: #a8151b; --red-text: #bf1a21; --red-soft: #fdecec; --on-red: #ffffff; --head: #d6232a;
  --good: #17804f; --warn: #965800; --bad: #b3121a; --charcoal: #2b2b31;
  --s-lead: #8b8b94; --s-contacted: #3b82d6; --s-quoted: #d99a00; --s-negotiating: #8b5cf6; --s-won: #1f9d63; --s-lost: #2b2b31;
  --shadow: 0 1px 2px rgba(30, 10, 10, .06), 0 6px 18px rgba(30, 10, 10, .05);
  --font: 'IBM Plex Sans Thai', system-ui, 'Segoe UI', Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141214; --surface: #1f1b1d; --ink: #f3eff0; --muted: #b3aaae; --line: #33292c; --line-strong: #4a3c40;
    --red: #d93a40; --red-deep: #ff8a8f; --red-text: #ff8a8f; --red-soft: #3a1b1e; --on-red: #ffffff; --head: #8f1a20;
    --good: #4cc38a; --warn: #e3a54a; --bad: #ff8a8f; --charcoal: #d9d4d6;
    --s-lead: #9a9aa3; --s-contacted: #62a3ee; --s-quoted: #e8b53a; --s-negotiating: #ab8cf7; --s-won: #43c088; --s-lost: #d9d4d6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141214; --surface: #1f1b1d; --ink: #f3eff0; --muted: #b3aaae; --line: #33292c; --line-strong: #4a3c40;
  --red: #d93a40; --red-deep: #ff8a8f; --red-text: #ff8a8f; --red-soft: #3a1b1e; --on-red: #ffffff; --head: #8f1a20;
  --good: #4cc38a; --warn: #e3a54a; --bad: #ff8a8f; --charcoal: #d9d4d6;
  --s-lead: #9a9aa3; --s-contacted: #62a3ee; --s-quoted: #e8b53a; --s-negotiating: #ab8cf7; --s-won: #43c088; --s-lost: #d9d4d6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.1px; }
h2 { font-size: 17px; font-weight: 600; }
a { color: var(--red-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.xs { font-size: 13px; }
svg.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* แถบบน */
.top { background: var(--head); color: #fff; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px rgba(120, 10, 14, .25); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 0 20px; }
.brand { font-weight: 700; font-size: 18px; padding: 12px 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.brand small { font-weight: 400; font-size: 12px; opacity: .85; }
.nav { display: flex; flex-wrap: wrap; align-items: stretch; margin-left: auto; }
.nav button { background: transparent; border: 0; border-bottom: 3px solid transparent; color: rgba(255, 255, 255, .88); padding: 0 14px; min-height: 52px; cursor: pointer; font-weight: 500; font-size: 15px; }
.nav button:hover { color: #fff; background: rgba(255, 255, 255, .1); }
.nav button[aria-current="page"] { color: #fff; border-bottom-color: #fff; font-weight: 600; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: #fff; color: var(--red-deep); font-size: 12px; font-weight: 700; text-align: center; }
.top-r { display: flex; align-items: center; gap: 8px; }
.icon-btn { background: transparent; border: 0; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(255, 255, 255, .16); }
.btn-white { background: #fff; color: var(--red-deep); border: 0; border-radius: 999px; padding: 7px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn-white:hover { background: #ffecec; }
.demo-bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.demo-bar div { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 13px; }
.demo-bar .pill { background: var(--red-soft); color: var(--red-text); font-weight: 600; padding: 1px 10px; border-radius: 999px; }

main { max-width: 1280px; margin: 0 auto; padding: 22px 16px 56px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
.grid-detail { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
.layout { display: grid; grid-template-columns: 270px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2, .grid-detail, .layout { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card h2 { margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile.hot { background: var(--red); border-color: var(--red); color: #fff; }
.tile.hot::before { background: rgba(255, 255, 255, .5); }
.tile.hot .k { color: rgba(255, 255, 255, .9); }

/* ปุ่มและช่องกรอก */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--red-soft); border-color: var(--red); }
.btn-primary { background: var(--red); color: var(--on-red); border-color: var(--red); font-weight: 600; }
.btn-primary:hover { background: var(--red-deep); border-color: var(--red-deep); color: #fff; }
.btn-danger { color: var(--bad); border-color: var(--bad); }
.btn-sm { padding: 5px 12px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--red-text); cursor: pointer; text-align: left; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 14px; font-weight: 500; }
input[type=text], input[type=search], input[type=tel], input[type=email], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--red); outline: 2px solid color-mix(in srgb, var(--red) 25%, transparent); }
textarea { resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.req { color: var(--red-text); }
.search { position: relative; flex: 1; min-width: 220px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 38px; border-radius: 999px; }

/* ป้ายกำกับ แบบในภาพอ้างอิง: เต็ม/เส้นขอบ/อ่อน */
.tg { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 12px; border-radius: 6px; border: 1.5px solid transparent; line-height: 1.5; white-space: nowrap; }
.t0 { background: var(--red); color: #fff; }
.t1 { background: var(--surface); color: var(--red-text); border-color: var(--red); }
.t2 { background: var(--charcoal); color: var(--surface); }
.t3 { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.t4 { background: var(--red-soft); color: var(--red-text); }
.t5 { background: color-mix(in srgb, var(--line) 80%, var(--surface)); color: var(--ink); }
.t6 { background: #7d1218; color: #fff; }
.t7 { background: var(--surface); color: var(--ink); border-color: var(--charcoal); }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 1px 10px 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.stage::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 6px; background: var(--red-soft); color: var(--red-text); }

/* ไซด์บาร์ */
.side { padding: 0; overflow: hidden; }
.side-h { padding: 14px 18px; background: color-mix(in srgb, var(--line) 55%, var(--surface)); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.side-h .cnt { background: var(--red); color: #fff; border-radius: 999px; font-size: 12px; padding: 0 9px; }
.side-s { padding: 14px 18px 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: none; }
.side-list { list-style: none; margin: 0; padding: 0 10px 12px; }
.side-list button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; border-radius: 10px; padding: 6px 8px; cursor: pointer; text-align: left; }
.side-list button:hover { background: var(--red-soft); }
.side-list button[aria-pressed="true"] { background: var(--red-soft); box-shadow: inset 3px 0 0 var(--red); }
.side-list .n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-list .plain { font-size: 14.5px; font-weight: 500; }
@media (max-width: 900px) { .side-list { display: flex; flex-wrap: wrap; gap: 4px; } .side-list li { flex: 0 0 auto; } .side-list button { width: auto; } }

/* แท็บแบบขีดเส้นใต้ */
.tabs-u { display: flex; flex-wrap: nowrap; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tabs-u button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; cursor: pointer; white-space: nowrap; font-weight: 500; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tabs-u button:hover { color: var(--ink); }
.tabs-u button[aria-pressed="true"] { color: var(--red-text); border-bottom-color: var(--red); font-weight: 600; }
.tabs-u .n { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; border: 1.5px solid currentColor; font-size: 12px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.tabs-u button[aria-pressed="true"] .n { background: var(--red); border-color: var(--red); color: #fff; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.tabs button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.tabs .n { margin-left: 6px; opacity: .8; font-variant-numeric: tabular-nums; }

/* รายการลูกค้า */
.clist { list-style: none; margin: 0; padding: 0; }
.crow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 190px 84px; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
.crow:last-child { border-bottom: 0; }
.crow:hover { background: var(--red-soft); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.v0 { background: var(--red-soft); color: var(--red-text); }
.v1 { background: var(--red); color: #fff; }
.v2 { background: color-mix(in srgb, var(--line) 80%, var(--surface)); color: var(--ink); }
.v3 { background: var(--charcoal); color: var(--surface); }
.cname { font-weight: 600; }
.cname .co { font-weight: 400; color: var(--muted); font-size: 14px; }
.csub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.cmid { font-size: 14px; }
.cmid .ph { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.cr { text-align: right; font-size: 13px; color: var(--muted); }
@media (max-width: 700px) { .crow { grid-template-columns: 44px minmax(0, 1fr) auto; } .cmid { display: none; } }

/* ตารางทั่วไป รายการ งาน */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 11px 0; border-bottom: 1px solid var(--line); }
.list > li:last-child { border-bottom: 0; }
.task { display: flex; gap: 12px; align-items: flex-start; }
.chk { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 6px; border: 2px solid var(--line-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: #fff; font-size: 14px; line-height: 1; padding: 0; }
.chk:hover { border-color: var(--red); }
.chk.on { background: var(--red); border-color: var(--red); }
.task .t { font-weight: 500; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.task .grow { flex: 1; min-width: 0; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 8px; border-radius: 8px; font-size: 14px; }
.x:hover { color: var(--bad); background: var(--red-soft); }
.late { color: var(--bad); font-weight: 700; }
.today { color: var(--warn); font-weight: 700; }

/* แท่ง */
.bar-row { margin-bottom: 14px; }
.bar { height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--line) 70%, var(--surface)); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 5px; }

/* ไทม์ไลน์ */
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line-strong); }
.tl li { position: relative; padding: 0 0 20px 20px; }
.tl li::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--surface); box-sizing: content-box; margin-left: -1px; }
.tl li.sale::before { background: var(--good); }

/* บอร์ด pipeline */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { flex: 0 0 268px; background: color-mix(in srgb, var(--line) 50%, var(--bg)); border-radius: 16px; padding: 12px; border-top: 5px solid var(--c); min-height: 120px; }
.col.over { outline: 2px dashed var(--red); }
.col-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; }
.col-h b { font-size: 15px; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: grab; box-shadow: var(--shadow); }
.deal.drag { opacity: .45; }
.deal .ttl { font-weight: 600; }
.deal select { margin-top: 10px; padding: 5px 10px; font-size: 14px; }

/* ตารางตัวอย่างข้อมูลที่ส่งออก */
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 460px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { position: sticky; top: 0; background: var(--red-soft); color: var(--ink); text-align: left; font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.sec td { font-weight: 700; background: color-mix(in srgb, var(--line) 50%, var(--surface)); }
tr.sub td { font-weight: 600; color: var(--muted); }
.msg { padding: 11px 14px; border-radius: 10px; font-size: 14.5px; margin-top: 12px; }
.msg.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid var(--good); }
.msg.err { background: var(--red-soft); border: 1px solid var(--red); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.steps { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }

/* โมดัลและข้อความแจ้ง */
.overlay { position: fixed; inset: 0; background: rgba(25, 8, 10, .6); display: grid; place-items: start center; padding: 24px 12px; overflow-y: auto; z-index: 20; }
.modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 580px; padding: 22px; border: 1px solid var(--line); border-top: 6px solid var(--red); }
.modal h2 { font-size: 20px; margin-bottom: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; justify-content: flex-end; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--charcoal); color: var(--surface); padding: 10px 20px; border-radius: 999px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; max-width: 92vw; }
#toast.show { opacity: 1; }
.empty { color: var(--muted); padding: 26px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- เพิ่มสำหรับดีไซน์ใหม่: บันทึกการติดต่อ + ออเดอร์ ---------- */
.tile .s { font-size: 13px; color: var(--muted); }
.tile.hot .s { color: rgba(255, 255, 255, .92); }
.tile.click { cursor: pointer; }
.tile.click:hover { border-color: var(--red); }
.layout-log { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .layout-log { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 68px; }
@media (max-width: 1000px) { .sticky { position: static; } }
.sec-h { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 16px; margin: 20px 0 10px; }
.sec-h:first-child { margin-top: 0; }
.stepno { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700; font-size: 14px; flex: none; }
fieldset.field { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.field legend { font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 6px; }
.field + .field, .field + .form-grid, .form-grid + .field { margin-top: 12px; }
.seg-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { position: relative; display: inline-block; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: inline-block; padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-weight: 500; font-size: 14.5px; }
.seg:hover span { border-color: var(--red); }
.seg input:checked + span { background: var(--red); border-color: var(--red); color: #fff; }
.seg.ck input:checked + span { background: var(--red-soft); border-color: var(--red); color: var(--red-text); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 2px; }
.chipbtn { border: 1px dashed var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13.5px; cursor: pointer; }
.chipbtn:hover { border-color: var(--red); color: var(--red-text); }
.chk-line { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-weight: 500; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 12px; }
.chk-line input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--red); flex: none; }
.chk-line:has(input:checked) { border-color: var(--red); background: var(--red-soft); }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

async function api(path, opt) {

  const init = { method: opt.method || 'GET', cache: 'no-store', credentials: 'same-origin', headers: { 'X-CRM': '1' } };
  if (opt.body !== undefined) { init.method = opt.method || 'POST'; init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opt.body); }
  const r = await fetch(path, init);
  if (r.status === 401 && !opt.noRedirect) { showLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง'); throw new AuthError('401'); }
  return r;
}
function adopt(j) {
  S = validState(j.state) ? j.state : emptyState();
  if (!Array.isArray(S.products)) S.products = PRODUCTS.slice();
  if (j.me) ME = j.me;
  S.me = ME ? ME.name : ''; S.seq = 0;
  revs = j.revs || { customers: {}, logs: {}, orders: {} };
  KINDS.forEach(k => { revs[k] = revs[k] || {}; });
  prodRev = j.productsRev || 0;
  base = {}; KINDS.forEach(k => { base[k] = new Map(S[k].map(r => [r.id, JSON.stringify(r)])); });
  prodBase = JSON.stringify(S.products);
  ver = j.version || 0; needRefresh = false;
}
function save() {
  dirty = true; setStat('saving');
  clearTimeout(pushT); pushT = setTimeout(pushState, 250);
}
/* เทียบข้อมูลปัจจุบันกับที่ซิงก์ล่าสุด → ได้เฉพาะรายการที่เพิ่ม/แก้/ลบ */
function diffOps() {
  const ops = [];
  KINDS.forEach(k => {
    const seen = new Set();
    S[k].forEach(r => {
      seen.add(r.id);
      const js = JSON.stringify(r), b = base[k].get(r.id);
      if (b === undefined) ops.push({ op: 'put', kind: k, id: r.id, rev: 0, data: JSON.parse(js), js });
      else if (b !== js) ops.push({ op: 'put', kind: k, id: r.id, rev: revs[k][r.id] || 0, data: JSON.parse(js), js });
    });
    base[k].forEach((b, id) => { if (!seen.has(id)) ops.push({ op: 'del', kind: k, id, rev: revs[k][id] || 0 }); });
  });
  const pj = JSON.stringify(S.products);
  return { ops, prod: pj !== prodBase ? { rev: prodRev, list: S.products.slice(), js: pj } : null };
}
const CONFLICT_TH = { customer_deleted: 'ลูกค้ารายนี้ถูกคนอื่นลบไปแล้ว', deleted: 'รายการนี้ถูกคนอื่นลบไปแล้ว', changed: 'รายการนี้ถูกคนอื่นแก้ไขไปก่อนหน้า', exists: 'รหัสรายการซ้ำ' };
/* เซิร์ฟเวอร์ปฏิเสธเพราะบางรายการถูกคนอื่นแก้ไปก่อน: ใช้ข้อมูลล่าสุดของเซิร์ฟเวอร์ แล้วใส่การแก้ไขที่ไม่ชนกลับเข้าไปส่งใหม่ */
function rebase(j, d) {
  const bad = new Map((j.conflicts || []).map(c => [c.kind + ':' + c.id, c.reason]));
  adopt(j);
  d.ops.forEach(o => {
    if (bad.has(o.kind + ':' + o.id)) return;
    const arr = S[o.kind], i = arr.findIndex(x => x.id === o.id);
    if (o.op === 'put') { if (i >= 0) arr[i] = JSON.parse(o.js); else arr.push(JSON.parse(o.js)); }
    else if (i >= 0) arr.splice(i, 1);
  });
  if (d.prod && !bad.has('products:0')) S.products = d.prod.list.slice();
  dirty = true;
  const reasons = Array.from(new Set(Array.from(bad.values()).map(r => CONFLICT_TH[r] || 'ถูกแก้ไขพร้อมกัน')));
  closeModal(); render(); setStat('conflict');
  toast((reasons.join(' / ') || 'มีคนอื่นแก้ไขพร้อมกัน') + ' — โหลดข้อมูลล่าสุดแล้ว การแก้ไขในรายการนั้นของคุณไม่ถูกบันทึก กรุณาตรวจและกรอกซ้ำ');
}
async function reloadState() { adopt(await (await api('api/state')).json()); render(); }
async function pushState() {
  if (pushing) return;
  pushing = true; let tries = 0, retry = false;
  try {
    while (dirty) {
      dirty = false;
      const d = diffOps();
      if (!d.ops.length && !d.prod) { setStat('saved'); break; }
      const r = await api('api/sync', { body: { ops: d.ops.map(o => ({ op: o.op, kind: o.kind, id: o.id, rev: o.rev, data: o.data })), products: d.prod ? { rev: d.prod.rev, list: d.prod.list } : null } });
      if (r.status === 409) {
        if (++tries > 3) { await reloadState(); setStat('conflict'); break; }
        rebase(await r.json(), d); continue;
      }
      if (r.status === 400 || r.status === 403) {
        const j = await r.json().catch(() => ({}));
        await reloadState(); setStat('saved'); toast((j.error || 'บันทึกไม่ได้') + ' — โหลดข้อมูลล่าสุดแล้ว'); break;
      }
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      d.ops.forEach(o => {
        if (o.op === 'put') { base[o.kind].set(o.id, o.js); revs[o.kind][o.id] = j.revs[o.kind][String(o.id)]; }
        else { base[o.kind].delete(o.id); delete revs[o.kind][o.id]; }
      });
      if (d.prod) { prodBase = d.prod.js; prodRev = j.productsRev; }
      if (j.version !== ver + 1) needRefresh = true;   /* มีคนอื่นบันทึกคั่นกลาง ให้รอบ poll ถัดไปดึงข้อมูลใหม่ */
      ver = j.version;
      if (!dirty) setStat('saved');
    }
  } catch (e) {
    if (!(e instanceof AuthError)) { dirty = true; retry = true; setStat('error'); }
  }
  pushing = false;
  if (retry) setTimeout(() => { if (dirty && !pushing) pushState(); }, 4000);
}

    '<fieldset class="field"><legend>การรับสินค้า</legend><div class="seg-row">' + seg('delivery', '', 'ยังไม่ระบุ', true, 'radio') + seg('delivery', 'ส่ง', 'ส่งถึงหน้างาน', false, 'radio') + seg('delivery', 'รับเอง', 'รับเองที่ร้าน', false, 'radio') + '</div></fieldset>' +

/* ---------- หน้า: ออเดอร์ & การขนส่ง ---------- */
function orderActions(o) {
  let b = '';
  if (o.status === 'reserved') b += '<button class="btn btn-sm btn-primary" data-action="deposit-order" data-id="' + o.id + '">รับมัดจำ</button> ';
  if (o.status === 'deposit') b += '<button class="btn btn-sm btn-primary" data-action="done-order" data-id="' + o.id + '">ปิดงาน</button> ';
  return b + '<button class="btn btn-sm" data-action="edit-order" data-id="' + o.id + '">แก้ไข</button>';
}
function orderTable(list, compact) {
  if (!list.length) return '<div class="empty">ไม่มีออเดอร์ในหมวดนี้</div>';
  const td = today();
  const head = ['กำหนดใช้ / ส่ง'].concat(compact ? [] : ['ลูกค้า']).concat(['สินค้า', 'การขนส่ง']).map(h => '<th>' + h + '</th>').join('') +
    '<th class="r">ยอดรวม</th><th class="r">มัดจำ</th><th class="r">คงเหลือหน้างาน</th><th>สถานะ</th><th></th>';
  return '<div class="tbl-wrap free"><table class="dt"><thead><tr>' + head + '</tr></thead><tbody>' +
    list.map(o => {
      const open = OPENS.includes(o.status), late = open && o.useDate && o.useDate < td;
      const bal = balance(o);
      return '<tr><td class="nowrap"><b class="num">' + fdate(o.useDate) + '</b>' + (open && o.useDate ? '<div class="xs ' + (late ? 'late' : dayDiff(o.useDate) <= 1 ? 'today' : 'muted') + '">' + relDay(o.useDate) + '</div>' : '') + '</td>' +
        (compact ? '' : '<td><button class="linkbtn" data-action="open-customer" data-id="' + o.cid + '">' + esc(cn(o.cid)) + '</button><div class="xs muted">เซลล์' + esc(o.rep || '-') + '</div></td>') +
        '<td>' + esc(o.product) + (o.qty ? '<div class="xs muted">' + esc(o.qty) + '</div>' : '') + '</td>' +
        '<td>' + esc(o.delivery || '-') + (o.place ? '<div class="xs muted">' + esc(o.place) + '</div>' : '') + '</td>' +
        '<td class="r">' + baht(o.amount) + '</td>' +
        '<td class="r">' + (o.status === 'reserved' || o.status === 'cancelled' ? '<span class="muted">-</span>' : baht(o.deposit) + '<div class="xs muted">' + fdate(o.depositAt) + '</div>') + '</td>' +
        '<td class="r">' + (o.status === 'cancelled' ? '<span class="muted">-</span>' : o.status === 'done' ? '<span class="muted">0</span>' : '<span class="' + (bal > 0 ? 'bal' : '') + '">' + baht(bal) + '</span>') + '</td>' +
        '<td class="nowrap">' + osChip(o) + '<br>' + prog(o) + '<div class="xs muted">' + esc(statusSub(o)) + '</div></td>' +
        '<td class="nowrap">' + orderActions(o) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function orderListHTML() {
  const q = ui.oq.trim().toLowerCase();
  const list = orderSorted(S.orders.filter(o => (ui.orderTab === 'all' || o.status === ui.orderTab) && (!q || (cn(o.cid) + ' ' + o.product + ' ' + (o.place || '') + ' ' + (o.rep || '')).toLowerCase().includes(q))));
  return orderTable(list, false);
}
function viewOrders() {
  const open = S.orders.filter(o => OPENS.includes(o.status));
  const cnt = k => k === 'all' ? S.orders.length : S.orders.filter(o => o.status === k).length;
  const tile = (k, v, s, c) => '<div class="tile" style="--c:' + c + '"><div class="k">' + k + '</div><div class="v num">฿' + baht(v) + '</div><div class="s">' + s + '</div></div>';
  return '<div class="row between"><div><h1>ออเดอร์ &amp; การขนส่ง</h1><p class="muted" style="margin:4px 0 0">ดูว่าลูกค้าแต่ละรายอยู่ขั้นไหน จองแล้ว จ่ายมัดจำแล้วเหลือจ่ายหน้างาน หรือเสร็จสิ้น</p></div><div class="row"><button class="btn" data-action="manage-products">จัดการรายการสินค้า</button><button class="btn btn-primary" data-action="new-order">+ เปิดออเดอร์</button></div></div>' +
    '<div class="tiles">' +
    tile('ยอดออเดอร์ที่ยังเปิดอยู่', sumBy(open, o => +o.amount || 0), open.length + ' ออเดอร์', 'var(--red)') +
    tile('รับมัดจำแล้ว', sumBy(open, o => o.status === 'deposit' ? +o.deposit || 0 : 0), 'จากออเดอร์ขั้น 2', 'var(--s-contacted)') +
    tile('ค้างรับหน้างาน', sumBy(open, balance), 'ยอดที่ต้องเก็บตอนส่งของ', 'var(--s-quoted)') +
    tile('เสร็จสิ้นแล้ว', sumBy(S.orders.filter(o => o.status === 'done'), o => +o.amount || 0), cnt('done') + ' ออเดอร์', 'var(--s-won)') +
    '</div>' +
    '<section class="card" style="padding:0"><div class="tabs-u" role="group" aria-label="กรองตามสถานะ">' +
    [['all', 'ทั้งหมด']].concat(OSLIST.map(k => [k, OS[k].tab])).map(t => '<button data-action="order-tab" data-tab="' + t[0] + '" aria-pressed="' + (ui.orderTab === t[0]) + '">' + t[1] + '<span class="n">' + cnt(t[0]) + '</span></button>').join('') + '</div>' +
    '<div style="padding:14px 16px"><div class="row" style="margin-bottom:12px"><div class="search">' + ICON.search + '<input type="search" id="oq" placeholder="ค้นหาลูกค้า สินค้า หรือสถานที่ส่ง" value="' + esc(ui.oq) + '" aria-label="ค้นหาออเดอร์"></div></div>' +
    '<div id="order-list">' + orderListHTML() + '</div></div></section>';
}

/* ---------- หน้า: ติดตามลูกค้า ---------- */
function custBase() {
  const q = ui.q.trim().toLowerCase();
  return S.customers.filter(c => (!ui.src || c.source === ui.src) && (!ui.rep || c.rep === ui.rep) && (!q || (c.name + ' ' + (c.company || '') + ' ' + (c.phone || '')).toLowerCase().includes(q)));
}
function filteredCustomers() {
  let a = custBase();
  if (ui.custTab === 'open') a = a.filter(c => openOrdersOf(c.id).length);
  if (ui.custTab === 'stale') a = a.filter(isStale);
  const key = c => { const l = lastLog(c.id); return l ? l.at : ''; };
  return ui.custTab === 'stale' ? a.sort((x, y) => key(x).localeCompare(key(y))) : a.sort((x, y) => key(y).localeCompare(key(x)) || x.name.localeCompare(y.name, 'th'));
}
function customerListHTML() {
  const list = filteredCustomers();
  if (!list.length) return '<div class="empty">ไม่พบลูกค้า</div>';
  return '<ul class="clist">' + list.map(c => {
    const l = lastLog(c.id), st = isStale(c);
    const oo = openOrdersOf(c.id);
    const chips = ['reserved', 'deposit'].map(k => { const n = oo.filter(o => o.status === k).length; return n ? '<span class="stage" style="--c:' + OS[k].c + '">' + OS[k].label + (n > 1 ? ' ×' + n : '') + '</span>' : ''; }).join('');
    return '<li class="crow" role="button" tabindex="0" data-action="open-customer" data-id="' + c.id + '"><div class="av v' + (c.id % 4) + '" aria-hidden="true">' + esc(initial(c.name)) + '</div>' +
      '<div style="min-width:0"><div class="cname">' + esc(c.name) + (c.company ? ' <span class="co">· ' + esc(c.company) + '</span>' : '') + '</div><div class="ctags">' + srcTag(c.source) + chips + '</div></div>' +
      '<div class="cmid"><div class="ph">' + ICON.phone + esc(c.phone || '-') + '</div><div class="xs muted">เซลล์' + esc(c.rep || '-') + '</div></div>' +
      '<div class="cr' + (st ? ' late' : '') + '">' + (l ? rel(l.at) : (st ? 'ยังไม่เคยติดต่อ' : 'เพิ่งเพิ่ม')) + '</div></li>';
  }).join('') + '</ul>';
}
function viewCustomers() {
  const base = custBase();
  const cnt = { all: base.length, open: base.filter(c => openOrdersOf(c.id).length).length, stale: base.filter(isStale).length };
  const reps = repList();
  const side = (title, items, action, cur) => '<div class="side-s">' + title + '</div><ul class="side-list">' + items.map(i => '<li><button data-action="' + action + '" data-v="' + esc(i[0]) + '" aria-pressed="' + (cur === i[0]) + '"><span class="plain">' + esc(i[0]) + '</span><span class="n">' + i[1] + '</span></button></li>').join('') + '</ul>';
  return '<div class="row between"><div><h1>ติดตามลูกค้า</h1><p class="muted" style="margin:4px 0 0">ดูว่าลูกค้าแต่ละรายติดต่อล่าสุดเมื่อไหร่ มีออเดอร์ค้างขั้นไหน และใครดูแล</p></div><button class="btn btn-primary" data-action="new-customer">+ ลูกค้าใหม่</button></div>' +
    '<div class="layout" style="margin-top:14px"><aside class="card side" aria-label="ตัวกรอง"><div class="side-h"><span>ตัวกรอง</span>' + ((ui.src || ui.rep) ? '<button class="linkbtn xs" data-action="clear-filters">ล้าง</button>' : '') + '</div>' +
    side('เซลล์ผู้ดูแล', reps.map(r => [r, S.customers.filter(c => c.rep === r).length]), 'set-rep', ui.rep) +
    side('แหล่งที่มา', SOURCES.map(s => [s, S.customers.filter(c => c.source === s).length]).filter(x => x[1] || x[0] === ui.src), 'set-src', ui.src) + '</aside>' +
    '<section class="card" style="padding:0"><div style="padding:14px 16px 4px"><div class="search">' + ICON.search + '<input type="search" id="q" placeholder="ค้นหาชื่อ บริษัท หรือเบอร์โทร" value="' + esc(ui.q) + '" aria-label="ค้นหาลูกค้า"></div></div>' +
    '<div class="tabs-u" role="group" aria-label="กรองตามการติดตาม">' + [['all', 'ทั้งหมด'], ['open', 'มีออเดอร์ค้าง'], ['stale', 'ไม่ได้ติดต่อเกิน ' + STALE_DAYS + ' วัน']].map(t => '<button data-action="cust-tab" data-tab="' + t[0] + '" aria-pressed="' + (ui.custTab === t[0]) + '">' + t[1] + '<span class="n">' + cnt[t[0]] + '</span></button>').join('') + '</div>' +
    '<div id="cust-list">' + customerListHTML() + '</div></section></div>';
}
function viewCustomer() {
  const c = cust(ui.cid);
  if (!c) { ui.view = 'customers'; return viewCustomers(); }
  const logs = S.logs.filter(l => l.cid === c.id).sort((a, b) => b.at.localeCompare(a.at));
  const orders = orderSorted(S.orders.filter(o => o.cid === c.id));
  const l = logs[0];
  const bought = sumBy(orders.filter(o => o.status === 'done'), o => +o.amount || 0);
  const kv = (k, v) => '<dt>' + k + '</dt><dd>' + v + '</dd>';
  return '<p style="margin:0 0 12px"><button class="linkbtn" data-view="customers">← กลับไปรายชื่อลูกค้า</button></p>' +
    '<div class="grid-detail"><aside class="card"><div class="row" style="flex-wrap:nowrap"><div class="av v' + (c.id % 4) + '" aria-hidden="true">' + esc(initial(c.name)) + '</div><div style="min-width:0"><h1 style="font-size:20px">' + esc(c.name) + '</h1><div class="muted small">' + esc(c.company || '') + '</div></div></div>' +
    '<dl class="kv">' + kv('เบอร์โทร', c.phone ? '<a href="tel:' + esc(c.phone.replace(/[^0-9+]/g, '')) + '">' + esc(c.phone) + '</a>' : '-') + kv('อีเมล', esc(c.email || '-')) + kv('ที่อยู่', esc(c.address || '-')) + kv('แหล่งที่มา', c.source ? srcTag(c.source) : '-') + kv('เซลล์ผู้ดูแล', esc(c.rep || '-')) +
    kv('ติดต่อล่าสุด', l ? '<span class="' + (isStale(c) ? 'late' : '') + '">' + rel(l.at) + '</span>' : 'ยังไม่เคยติดต่อ') + kv('ยอดซื้อสะสม', '฿' + baht(bought)) + kv('หมายเหตุ', esc(c.note || '-')) + '</dl>' +
    '<div class="row" style="margin-top:16px"><button class="btn btn-primary" data-action="log-for" data-id="' + c.id + '">' + ICON.phone + ' บันทึกการติดต่อ</button><button class="btn" data-action="edit-customer" data-id="' + c.id + '">แก้ไข</button><button class="btn btn-danger" data-action="delete-customer" data-id="' + c.id + '">ลบ</button></div></aside>' +
    '<div class="stack"><section class="card"><div class="row between"><h2>ออเดอร์ &amp; การขนส่ง</h2><button class="btn btn-sm" data-action="new-order" data-cid="' + c.id + '">+ เปิดออเดอร์</button></div>' + orderTable(orders, true) + '</section>' +
    '<section class="card"><h2>ประวัติการติดต่อ</h2>' + (logs.length ? '<ul class="tl">' + logs.map(x => '<li' + (x.oid ? ' class="sale"' : '') + '><div class="row between" style="gap:6px"><div class="xs muted">' + ftime(x.at) + ' · ' + CHANNELS[x.channel] + ' · เซลล์' + esc(x.rep) + '</div><button class="x" data-action="delete-log" data-id="' + x.id + '" aria-label="ลบบันทึกนี้">✕</button></div>' +
      '<div style="margin:2px 0 4px">' + tagChips(x) + '</div><div>' + esc(x.summary) + '</div>' +
      (x.product ? '<div class="xs muted" style="margin-top:4px">สินค้า: ' + esc(x.product) + (x.qty ? ' ' + esc(x.qty) : '') + (x.needDate ? ' · ใช้ ' + fdate(x.needDate) : '') + (x.delivery ? ' · ' + esc(x.delivery) : '') + '</div>' : '') + '</li>').join('') + '</ul>' : '<div class="empty">ยังไม่มีบันทึกการติดต่อ</div>') + '</section></div></div>';
}

/* ---------- หน้า: สรุปรายงาน (รายวัน / รายเดือน / รายปี) ---------- */
const MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
function parseD(s) { const p = s.slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function periodRange(p, anchor) {

  if (p === 'month') return { from: ymd(new Date(y, m, 1)), to: ymd(new Date(y, m + 1, 0)), label: MONTHS_FULL[m] + ' ' + (y + 543) };
  return { from: y + '-01-01', to: y + '-12-31', label: 'ปี ' + (y + 543) };

function shiftAnchor(p, anchor, n) {
  const d = parseD(anchor);

  const opened = S.orders.filter(o => inr(o.created) && o.status !== 'cancelled');
  const depIn = S.orders.filter(o => (o.status === 'deposit' || o.status === 'done') && inr(o.depositAt));
  const doneO = S.orders.filter(o => o.status === 'done' && inr(o.doneAt));

}

    if (!r.ok) throw new Error('http ' + r.status);

function previewTable(rows) {

    return '<tr' + cls + '>' + tds + '</tr>';

['delete-customer', 'do-delete-customer', 'delete-order', 'do-delete-order', 'delete-log', 'delete-product'].forEach(k => {

});
document.addEventListener('click', e => {
  if (e.target.matches('[data-overlay]')) { closeModal(); return; }
  const pt = e.target.closest('[data-put]');
  if (pt) { const inp = document.getElementById(pt.dataset.put); if (inp) { inp.value = pt.dataset.val; inp.focus(); } return; }
  const fl = e.target.closest('[data-fill]');
  if (fl) { const inp = document.getElementById(fl.dataset.fill); if (inp) inp.value = addDays(+fl.dataset.days); return; }
  const v = e.target.closest('[data-view]');
  if (v) { if (v.dataset.view === 'log') ui.logCid = null; ui.view = v.dataset.view; window.scrollTo(0, 0); if (ui.view === 'users') loadUsers(); render(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn && fn(el) !== false) render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); const fn = ACTIONS[e.target.dataset.action]; if (fn && fn(e.target) !== false) render(); }
});
document.addEventListener('input', e => {

  if (id === 'q') { ui.q = e.target.value; $('#cust-list').innerHTML = customerListHTML(); }
  else if (id === 'oq') { ui.oq = e.target.value; $('#order-list').innerHTML = orderListHTML(); }
  else if (id === 'lq') { ui.lq = e.target.value; $('#log-list').innerHTML = logListHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target, ch = t.dataset && t.dataset.change;
  if (ch === 'log-cust') { $('#newcust').hidden = t.value !== 'new'; const n = $('#f-nname'); if (n) n.required = t.value === 'new'; }
  else if (ch === 'log-order') { $('#orderbox').hidden = !t.checked; }
  else if (ch === 'rp-date') { const v = t.value; if (ui.rp === 'day' && v) ui.rd = v; else if (ui.rp === 'month' && v) ui.rd = v + '-01'; else if (ui.rp === 'year' && /^\d{4}$/.test(v)) ui.rd = v + '-01-01'; else return; render(); }
  else if (ch === 'log-rep') { ui.lrep = t.value; $('#log-list').innerHTML = logListHTML(); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const f = Object.fromEntries(fd.entries());
  const kind = form.dataset.form;
  const num = v => Math.max(0, parseFloat(v) || 0);
  const t = v => (v || '').trim();

  if (kind === 'login') { doLogin(f); return; }
  if (kind === 'user') { saveUser(f); return; }
  if (kind === 'pw') { savePw(f); return; }
  if (kind === 'product') {
    const name = t(f.name).replace(/\s+/g, ' ');
    if (!name) return;
    if (S.products.some(x => x.toLowerCase() === name.toLowerCase())) { toast('มี “' + name + '” ในรายการแล้ว'); return; }
    S.products.push(name); save(); productsModal(); refreshProdLists(); toast('เพิ่ม “' + name + '” แล้ว');
    return;
  }
  if (kind === 'customer') {
    const data = { name: t(f.name), company: t(f.company), phone: t(f.phone), email: t(f.email), address: t(f.address), source: f.source || '', rep: t(f.rep), note: t(f.note) };
    if (!data.name) return;
    if (f.id) { Object.assign(cust(+f.id), data); toast('บันทึกการแก้ไขแล้ว'); }
    else {
      const dup = data.phone && S.customers.find(c => c.phone === data.phone);
      const c = Object.assign({ id: nid(), created: nowLocal() }, data); S.customers.push(c);
      ui.cid = c.id; ui.view = 'customer';
      toast(dup ? 'เพิ่มลูกค้าแล้ว (เบอร์ตรงกับ ' + dup.name + ' ตรวจสอบว่าไม่ซ้ำ)' : 'เพิ่มลูกค้าเรียบร้อยแล้ว');
    }
    closeModal();
  } else if (kind === 'log') {
    const rep = t(f.rep), summary = t(f.summary);
    if (!rep) { toast('กรอกชื่อเซลล์ก่อน'); return; }
    if (!summary) { toast('กรอกรายละเอียดการคุยก่อน'); return; }
    let cid = +f.cid, isNew = false;
    if (f.cid === 'new') {
      const name = t(f.nname); if (!name) { toast('กรอกชื่อลูกค้าใหม่'); return; }
      const c = { id: nid(), name, company: '', phone: t(f.nphone), email: '', address: '', source: f.nsource || '', rep, note: '', created: nowLocal() };
      S.customers.push(c); cid = c.id; isNew = true;
    }
    if (!cid || !cust(cid)) { toast('เลือกลูกค้าก่อน'); return; }
    if (f.mkorder && !t(f.product)) { toast('ถ้าจะเปิดออเดอร์ ต้องกรอกชื่อสินค้าในข้อ 3'); if (isNew) { S.customers.pop(); } return; }
    const log = { id: nid(), cid, rep, at: f.at || nowLocal(), channel: f.channel || 'call', tags: fd.getAll('tag'), summary, product: t(f.product), qty: t(f.qty), needDate: f.needDate || '', delivery: f.delivery || '', place: t(f.place), oid: null };
    S.logs.push(log);
    S.me = rep;
    let msg = 'บันทึกการติดต่อกับ ' + cn(cid) + ' แล้ว';
    if (f.mkorder) {
      const dep = num(f.deposit);
      const o = { id: nid(), cid, rep, lid: log.id, product: log.product, qty: log.qty, amount: num(f.amount), deposit: dep, depositAt: dep ? (f.depositAt || today()) : '', depositNote: '', finalPaid: 0, delivery: log.delivery || 'ส่ง', place: log.place, useDate: log.needDate, status: dep ? 'deposit' : 'reserved', doneAt: '', note: '', created: log.at };
      S.orders.push(o); log.oid = o.id;
      msg += ' และเปิดออเดอร์สถานะ “' + OS[o.status].label + '”';
    }
    ui.logCid = null;
    ui.flash = esc(msg) + (f.mkorder ? ' <button class="linkbtn" data-action="open-orders" data-tab="all">ดูในตารางออเดอร์</button>' : '');
  } else if (kind === 'order') {
    const cid = +f.cid; if (!cid || !t(f.product)) return;
    let status = f.status, dep = num(f.deposit);
    if (status === 'reserved' && dep > 0) status = 'deposit';
    if (status === 'deposit' && dep <= 0) { toast('สถานะ “จ่ายมัดจำแล้ว” ต้องใส่ยอดมัดจำด้วย'); return; }
    if (status === 'reserved') dep = 0;
    const data = { cid, product: t(f.product), qty: t(f.qty), amount: num(f.amount), deposit: dep, depositAt: dep ? (f.depositAt || today()) : '', delivery: f.delivery || 'ส่ง', place: t(f.place), useDate: f.useDate || '', rep: t(f.rep), note: t(f.note), status };
    if (f.id) {
      const o = ord(+f.id);
      if (status === 'done' && o.status !== 'done') { data.finalPaid = Math.max(0, data.amount - dep); data.doneAt = today(); }
      if (status !== 'done') { data.finalPaid = 0; data.doneAt = ''; }
      Object.assign(o, data); toast('บันทึกออเดอร์แล้ว');
    } else {
      const o = Object.assign({ id: nid(), lid: f.lid ? +f.lid : null, depositNote: '', finalPaid: status === 'done' ? Math.max(0, data.amount - dep) : 0, doneAt: status === 'done' ? today() : '', created: nowLocal() }, data);
      S.orders.push(o);
      if (o.lid && lgx(o.lid)) lgx(o.lid).oid = o.id;
      toast('เปิดออเดอร์เรียบร้อยแล้ว');
    }
    closeModal();
  } else if (kind === 'deposit') {
    const o = ord(+f.id), amt = num(f.amount); if (!o || amt <= 0) return;
    Object.assign(o, { deposit: amt, depositAt: f.at || today(), depositNote: t(f.note), status: 'deposit' });
    toast('บันทึกการรับมัดจำแล้ว เหลือจ่ายหน้างาน ฿' + baht(balance(o)));
    closeModal();
  } else if (kind === 'done') {
    const o = ord(+f.id); if (!o) return;
    Object.assign(o, { finalPaid: num(f.paid), doneAt: f.at || today(), status: 'done', note: t(f.note) ? (o.note ? o.note + ' | ' : '') + t(f.note) : o.note });
    toast('ปิดงานเรียบร้อยแล้ว');
    closeModal();
  }
  save(); render();
});

async function doLogin(f) {

  try {
    const r = await api('api/login', { body: { username: (f.username || '').trim(), password: f.password || '' }, noRedirect: true });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { loginMsg(j.error || 'เข้าสู่ระบบไม่สำเร็จ'); return; }
    ui.view = 'dashboard'; await bootOnline();

  return '<div class="row between"><div><h1>ผู้ใช้</h1><p class="muted" style="margin:4px 0 0">เซลล์บันทึก/แก้ไขข้อมูลได้ · หัวหน้าลบข้อมูล จัดการสินค้า และส่งออกไฟล์ได้เพิ่ม · ผู้ดูแลจัดการผู้ใช้และสำรองข้อมูลได้</p></div><button class="btn btn-primary" data-action="new-user">+ เพิ่มผู้ใช้</button></div>' +
    (USERS ? '<section class="card" style="margin-top:14px"><div class="tbl-wrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>บทบาท</th><th>สถานะ</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' : '<p class="muted" style="margin-top:14px">กำลังโหลด…</p>') +
    '<section class="card" style="margin-top:16px"><h2>สำรองข้อมูล</h2><p class="small muted" style="margin:0 0 10px">ระบบสำรองฐานข้อมูลอัตโนมัติทุกวันบนเซิร์ฟเวอร์ แนะนำให้ดาวน์โหลดไฟล์สำรองเก็บไว้ที่อื่นด้วยเป็นประจำ (เช่น สัปดาห์ละครั้ง) ไฟล์นี้มีข้อมูลลูกค้าและรหัสผ่านที่เข้ารหัสแล้ว เก็บให้ปลอดภัย</p>' +
    '<a class="btn" href="api/backup" download style="text-decoration:none;display:inline-block">ดาวน์โหลดไฟล์สำรอง (.db)</a></section>';
}
function userModal(id) {
  const u = id ? (USERS || []).find(x => x.id === id) : null;
  openModal('<h2>' + (u ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้') + '</h2><form data-form="user"><input type="hidden" name="id" value="' + (u ? u.id : '') + '"><div class="form-grid">' +
    (u ? '<div class="field"><label>ชื่อผู้ใช้ (สำหรับล็อกอิน)</label><input type="text" value="' + esc(u.username) + '" disabled></div>' : fld('u-un', 'ชื่อผู้ใช้ (ภาษาอังกฤษ/ตัวเลข ใช้ล็อกอิน)', 'username', '', { req: true })) +
    fld('u-name', 'ชื่อที่แสดง (ชื่อเซลล์)', 'name', u ? u.name : '', { req: true }) +
    '<div class="field"><label for="u-role">บทบาท</label><select id="u-role" name="role">' + ['sales', 'manager', 'admin'].map(r => '<option value="' + r + '"' + (u && u.role === r ? ' selected' : '') + '>' + ROLE_TH[r] + '</option>').join('') + '</select></div>' +
    (u ? '<div class="field"><label for="u-act">สถานะ</label><select id="u-act" name="active"><option value="1"' + (u.active ? ' selected' : '') + '>ใช้งานอยู่</option><option value="0"' + (u.active ? '' : ' selected') + '>ปิดใช้งาน</option></select></div>' : '') +
    '<div class="field full"><label for="u-pw">' + (u ? 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'รหัสผ่านเริ่มต้น (อย่างน้อย 8 ตัวอักษร)') + '</label><input type="password" id="u-pw" name="password" minlength="8" autocomplete="new-password"' + (u ? '' : ' required') + '></div>' +
    '</div><div class="actions"><button type="button" class="btn" data-action="close-modal">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึก</button></div></form>');
}
async function saveUser(f) {
  const id = +f.id || 0;
  const body = id ? { name: (f.name || '').trim(), role: f.role, active: f.active === '1' } : { username: (f.username || '').trim(), name: (f.name || '').trim(), role: f.role, password: f.password };
  if (id && f.password) body.password = f.password;
  try {
    const r = await api(id ? 'api/users/' + id : 'api/users', { body });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error || 'บันทึกไม่สำเร็จ'); return; }
    USERS = j.users; closeModal(); toast('บันทึกผู้ใช้แล้ว'); render();
  } catch (e) { if (!(e instanceof AuthError)) toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
}

/* ---------- เริ่มระบบ + ดึงข้อมูลที่คนอื่นบันทึก ---------- */
let pollTimer = null, unloadBound = false;
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (!ME || dirty || pushing) return;
    try {
      const j = await (await api('api/version')).json();
      if (j.version === ver && !needRefresh) { setStat('saved'); return; }
      const a = document.activeElement;
      if ((a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest('#app')) || $('#modal-root').innerHTML) return;
      adopt(await (await api('api/state')).json()); render(); setStat('saved');
    } catch (e) { if (!(e instanceof AuthError)) setStat('offline'); }
  }, 8000);
}
async function bootOnline() {
  let r = null;
  try { r = await api('api/state', { noRedirect: true }); } catch (e) { r = null; }
  if (!r || r.status >= 500) {
    getRoot().innerHTML = '<section class="card"><h2>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</h2><p class="muted">กำลังลองใหม่อัตโนมัติ… (ถ้าเซิร์ฟเวอร์เพิ่งเริ่มทำงาน อาจใช้เวลาครู่หนึ่ง)</p></section>';
    setTimeout(bootOnline, 3000); return;
  }
  if (r.status === 401) { const j = await r.json().catch(() => ({})); showLogin('', !!j.setup); return; }
  adopt(await r.json());
  document.body.classList.remove('out');
  const bar = $('.demo-bar > div');
  if (bar) bar.innerHTML = '<span class="pill">ออนไลน์</span><span>เข้าสู่ระบบเป็น <span class="userchip">' + esc(ME.name) + '</span> · ' + ROLE_TH[ME.role] + '</span><span id="savestat" class="muted" role="status"></span>' +
    '<button class="linkbtn" data-action="change-pw">เปลี่ยนรหัสผ่าน</button><button class="linkbtn" data-action="logout">ออกจากระบบ</button>';
  render(); setStat('saved'); startPolling();
  if (!unloadBound) { unloadBound = true; window.addEventListener('beforeunload', e => { if (dirty || pushing) { e.preventDefault(); e.returnValue = ''; } }); }
}
bootOnline();
</script>
</body>
